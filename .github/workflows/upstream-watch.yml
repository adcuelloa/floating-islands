# Read-only upstream watch inspection (docs/UPSTREAM_WATCH.md §3).
# Dispatch only, read-only preview: no issue permissions, no secrets, no schedule.
# Automated reporting, state issues, and schedules are tracked separately.
name: upstream-watch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Informational only: inspect-only workflow (both true and false are strictly read-only)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  inspect:
    name: inspect upstream (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout of this repository; no issue access, no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1" # LTS line; CI's Arch nodejs is 26.x
          package-manager-cache: false
      - name: inspect (read-only)
        id: inspect
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          ulimit -f 2097152 # no single file above 2 GiB (git packs included)
          node .github/upstream-watch/inspect.mjs --work "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/out/report.json" --summary "$RUNNER_TEMP/out/summary.md"
          code=$?
          set -e
          if [ -f "$RUNNER_TEMP/out/summary.md" ]; then
            cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: upstream-report
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14
